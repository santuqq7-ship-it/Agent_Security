# LoRA SFT configuration using the corrected single-score Guardian prompt.
model_path: practice/models/Qwen2.5-1.5B-Instruct
train_file: practice/toolsafe_reproduction/data/sft_agentharm_clean/train.jsonl
validation_file: practice/toolsafe_reproduction/data/sft_agentharm_clean/validation.jsonl
output_dir: practice/toolsafe_reproduction/results/sft_guardian_lora_clean

seed: 20260825
device: auto
dtype: auto
max_length: 2048
prompt_head_tokens: 512
per_device_batch_size: 1
gradient_accumulation_steps: 4
epochs: 2
learning_rate: 0.0001
weight_decay: 0.0
max_grad_norm: 1.0

# Only attention projection matrices receive LoRA updates.
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
gradient_checkpointing: false
