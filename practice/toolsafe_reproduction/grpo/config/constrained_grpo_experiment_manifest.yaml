    optimizer_created_by_preflight: false
  e6_bounded_resume_gate:
    status: passed
    report: practice/toolsafe_reproduction/results/constrained_grpo_e6/e6_acceptance.json
    resumed_from_global_step: 1
    completed_global_step: 2
    mean_optimizer_step_seconds: 279.914996199
    peak_cuda_memory_allocated_gb: 60.33518648147583
    old_new_parity_max_abs_error: 0.0
    latest_checkpoint_complete: true
