  e7_user_started_formal_training:
    status: paused_before_start
    reason: Official TS-Guard 7B evaluation and TS-Flow integration were prioritized after E6 exposed a 25-30 hour projected full run.
    formal_training_started: false
  official_guard_and_ts_flow:
